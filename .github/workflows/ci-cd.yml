name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: cicd-webapp
  APP_URL: https://hamza-cicd-webapp-gvdqe8c8ehbmduep.swedencentral-01.azurewebsites.net

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  docker-publish:
    name: Build and Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Azure
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Azure Web App to pull latest image
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_WEBHOOK_URL }}
        run: curl -fsS -X POST "$WEBHOOK_URL" -d ""

      - name: Smoke test deployed app
        run: |
          sleep 60
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors "$APP_URL/health"